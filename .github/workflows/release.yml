name: Release

# Pushing a tag such as v0.1.0 builds every archive, publishes a GitHub release
# and pushes the container image to GHCR. The only credential used is the
# GITHUB_TOKEN every workflow run gets; there are no other secrets.
on:
  push:
    tags: ["v*"]

# Nothing by default; each job below asks for exactly what it writes.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"

jobs:
  archives:
    name: Archives and GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release and attach files to it
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out the version from the tag
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::The tag $GITHUB_REF_NAME is not a version like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --check-size makes a build over the size budget fail the release.
      - name: Build every platform
        env:
          MARQUEE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build.sh --check-size

      # The UI is built now, so vet and the tests see the real embedded files.
      - name: go vet and go test
        run: |
          go vet ./...
          go test ./...

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          files=(bin/marquee_"${VERSION}"_*.tar.gz bin/marquee_"${VERSION}"_*.zip bin/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run: the release exists, so replace its files.
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            args=(--title "Marquee ${VERSION}" --verify-tag)
            if [ -f "releases/${VERSION}.md" ]; then
              args+=(--notes-file "releases/${VERSION}.md")
            else
              args+=(--generate-notes)
            fi
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${files[@]}" "${args[@]}"
          fi

  image:
    name: Container image on GHCR
    needs: archives            # only publish an image for a build that passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to ghcr.io/baileypillon/marquee
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :<version> always; :latest only for a final release, so a pre-release
      # such as 0.2.0-rc.1 never becomes what "latest" pulls.
      - name: Work out the image tags
        id: tags
        env:
          VERSION: ${{ needs.archives.outputs.version }}
          PRERELEASE: ${{ needs.archives.outputs.prerelease }}
        run: |
          set -euo pipefail
          {
            echo "list<<EOF"
            echo "ghcr.io/baileypillon/marquee:${VERSION}"
            if [ "$PRERELEASE" != true ]; then echo "ghcr.io/baileypillon/marquee:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64, arm64, arm/v7)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false   # keeps the GHCR manifest list to the three real platforms
          sbom: false
          build-args: VERSION=${{ needs.archives.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        env:
          VERSION: ${{ needs.archives.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm "ghcr.io/baileypillon/marquee:${VERSION}" --version
